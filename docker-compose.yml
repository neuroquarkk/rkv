services:
  registry:
    build:
      context: .
      args:
        APP_NAME: registry
    container_name: "rkv-registry"
    ports:
      - "8010:8010"
    environment:
      PORT: 8010
    restart: unless-stopped

  router:
    build:
      context: .
      args:
        APP_NAME: router
    container_name: "rkv-router"
    environment:
      PORT: 8081
      REGISTRY_URL: registry:8010
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - registry

  member-1:
    build:
      context: .
      args:
        APP_NAME: shard
    environment:
      PORT: 8080
      SHARD_ADDR: member-1:8080
      REGISTRY_URL: registry:8010
    restart: unless-stopped
    depends_on:
      - registry

  member-2:
    build:
      context: .
      args:
        APP_NAME: shard
    environment:
      PORT: 8080
      SHARD_ADDR: member-2:8080
      REGISTRY_URL: registry:8010
    restart: unless-stopped
    depends_on:
      - registry

  member-3:
    build:
      context: .
      args:
        APP_NAME: shard
    environment:
      PORT: 8080
      SHARD_ADDR: member-3:8080
      REGISTRY_URL: registry:8010
    restart: unless-stopped
    depends_on:
      - registry
